spring.application.name=fixture

# --- Conexión a la base (Neon) ---
# Las credenciales vienen SIEMPRE de variables de entorno: nunca se suben a GitHub.
# DB_URL usa el endpoint directo de Neon (no el "-pooler"), por ejemplo:
#   jdbc:postgresql://<host>.neon.tech/<base>?sslmode=require
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
# El plan gratuito de Neon limita las conexiones simultáneas.
spring.datasource.hikari.maximum-pool-size=5

# --- Esquema ---
# Las tablas las crea y modifica solo Flyway (src/main/resources/db/migration).
# Hibernate únicamente verifica al arrancar que las entidades coincidan con las tablas.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate

# Evita consultas a la base escondidas en la capa web.
spring.jpa.open-in-view=false

# --- Login del organizador (JWT) ---
# Secreto para firmar los tokens: al menos 32 caracteres. Solo por variable de entorno, nunca en el repo.
app.jwt.secreto=${JWT_SECRETO}
# Minutos que dura un token desde el login.
app.jwt.expiracion-min=${JWT_EXPIRACION_MIN}
