spring.application.name=fixture

# Puerto: Render lo define en la variable PORT; en local es 8080.
server.port=${PORT:8080}

# --- Conexión a la base (Supabase) ---
# Las credenciales vienen SIEMPRE de variables de entorno: nunca se suben a GitHub.
# DB_URL usa el "Session pooler" de Supabase (IPv4, puerto 5432), por ejemplo:
#   jdbc:postgresql://aws-0-<region>.pooler.supabase.com:5432/postgres?sslmode=require
# con DB_USER=postgres.<id-del-proyecto>. No usar la conexión directa (db.<id>.supabase.co: solo IPv6, y Render
# no tiene IPv6 saliente) ni el "Transaction pooler" (puerto 6543: no admite sentencias preparadas y falla con Flyway).
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
# Pocas conexiones: alcanza para el uso esperado y el pooler gratis de Supabase tiene un límite bajo.
spring.datasource.hikari.maximum-pool-size=3

# --- Esquema ---
# Las tablas las crea y modifica solo Flyway (src/main/resources/db/migration).
# Hibernate únicamente verifica al arrancar que las entidades coincidan con las tablas.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate

# Evita consultas a la base escondidas en la capa web.
spring.jpa.open-in-view=false

# --- Login del organizador (JWT) ---
# Secreto para firmar los tokens: al menos 32 caracteres. Solo por variable de entorno, nunca en el repo.
app.jwt.secreto=${JWT_SECRETO}
# Minutos que dura un token desde el login: 480 (8 horas, una jornada de torneo) si no se define.
app.jwt.expiracion-min=${JWT_EXPIRACION_MIN:480}

# --- CORS ---
# Dominios del frontend que pueden llamar a la API, separados por coma
# (ej.: https://fixture-front.onrender.com). Si no se define, no se acepta ningún otro dominio.
app.cors.origenes=${CORS_ORIGENES:}
